<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>車輛美術館 · 39 台車的一夜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ctext y=%2226%22 font-size=%2226%22%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F4F5F6; --ink:#1C1E22; --ink-soft:#5A6068; --ink-faint:#8A9098;
    --line:#D6D9DD; --card:#FBFBFC; --accent:#2A5C8A; --warn:#A8560E;
    --ease-micro:cubic-bezier(0.32,0.72,0.28,1.00);
    --ease-comp:cubic-bezier(0.22,0.61,0.24,1.00);
    --ease-region:cubic-bezier(0.65,0.02,0.15,1.00);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
    font:400 14px/1.65 "Noto Sans TC","PingFang TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #ui>*{pointer-events:auto}

  /* ---- 開場 ---- */
  #boot{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity 900ms var(--ease-region)}
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{margin:0;font-size:26px;font-weight:500;letter-spacing:.14em}
  #boot .sub{color:var(--ink-soft);font-size:13px;letter-spacing:.06em}
  #bar{width:min(420px,64vw);height:2px;background:var(--line);overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--ink);
    transition:transform 400ms var(--ease-comp);transform-origin:left}
  #bootmsg{color:var(--ink-faint);font-size:12px;min-height:1.6em;letter-spacing:.04em}
  #bootstart{margin-top:6px;padding:11px 26px;border:1px solid var(--ink);background:transparent;
    color:var(--ink);font:inherit;font-size:13px;letter-spacing:.12em;cursor:pointer;opacity:0;
    transition:opacity 400ms var(--ease-comp),background 180ms var(--ease-micro)}
  #bootstart.on{opacity:1}
  #bootstart:hover{background:var(--ink);color:var(--paper)}

  /* ---- 常駐 HUD ---- */
  #hud{position:fixed;top:14px;left:16px;font-size:11.5px;color:var(--ink-soft);
    letter-spacing:.05em;line-height:1.9;text-shadow:0 1px 2px rgba(255,255,255,.7)}
  #hud b{font-weight:500;color:var(--ink)}
  #perf{position:fixed;top:14px;right:16px;font-size:11px;color:var(--ink-faint);
    text-align:right;letter-spacing:.04em;line-height:1.8;text-shadow:0 1px 2px rgba(255,255,255,.7)}
  #crosshair{position:fixed;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
    border-radius:50%;background:rgba(28,30,34,.42);pointer-events:none}

  /* ---- 導覽 ---- */
  #nav{position:fixed;inset:0;background:rgba(244,245,246,.94);z-index:40;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #nav.on{display:flex}
  #nav h2{margin:0 0 12px;font-size:14px;font-weight:500;letter-spacing:.2em;color:var(--ink-soft)}
  .door{width:min(560px,80vw);display:grid;grid-template-columns:34px 1fr auto;gap:16px;
    align-items:baseline;padding:13px 18px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;text-align:left;font:inherit;color:var(--ink);
    transition:transform 180ms var(--ease-micro),box-shadow 180ms var(--ease-micro),border-color 180ms var(--ease-micro)}
  .door:hover{transform:scale(1.014);box-shadow:0 6px 20px rgba(28,30,34,.10);border-color:var(--ink-faint)}
  .door .n{color:var(--ink-faint);font-size:12px;letter-spacing:.1em}
  .door .t{font-size:14.5px;letter-spacing:.04em}
  .door .t small{display:block;color:var(--ink-soft);font-size:11.5px;letter-spacing:.02em;margin-top:3px}
  .door .v{color:var(--ink-faint);font-size:11px;white-space:nowrap}
  .door.here{border-color:var(--ink);background:#fff}
  #navhint{margin-top:16px;color:var(--ink-faint);font-size:11px;letter-spacing:.06em}

  /* ---- 提示條 ---- */
  #toast{position:fixed;left:50%;bottom:56px;transform:translate(-50%,10px);opacity:0;
    background:var(--card);border:1px solid var(--line);padding:10px 18px;font-size:12.5px;
    letter-spacing:.03em;max-width:min(680px,86vw);box-shadow:0 6px 22px rgba(28,30,34,.08);
    transition:opacity 300ms var(--ease-comp),transform 300ms var(--ease-comp)}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #err{position:fixed;left:16px;bottom:14px;max-width:min(720px,80vw);font-size:11px;
    color:var(--warn);white-space:pre-wrap;line-height:1.7}
</style>
<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.js",
  "three/addons/":"./vendor/three/addons/"
}}
</script>
</head>
<body>
<div id="ui">
  <div id="hud"></div>
  <div id="perf"></div>
  <div id="crosshair"></div>
  <div id="toast"></div>
  <div id="err"></div>
  <div id="nav">
    <h2>六 廳 · 自 由 探 索</h2>
    <div id="doors"></div>
    <div id="navhint">Tab 開關此頁　·　點畫面鎖定滑鼠　·　WASD 移動　·　Shift 快走　·　F 坐下／起身　·　G 灰階檢驗　·　P 後製開關　·　B 效能量測</div>
  </div>
</div>
<div id="boot">
  <h1>車 輛 美 術 館</h1>
  <div class="sub">39 台車的一夜</div>
  <div id="bar"><i></i></div>
  <div id="bootmsg">正在準備…</div>
  <button id="bootstart">走 進 去</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
